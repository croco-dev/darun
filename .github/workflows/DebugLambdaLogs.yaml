name: Debug Lambda Logs

on:
  workflow_dispatch:

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    environment:
      name: prod-graphql
    steps:
      - uses: croco-dev/aws-profile-action@v1.3
        with:
          profile: darun
          region: ap-northeast-2
          access-key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Inspect deployed package
        env:
          AWS_PROFILE: darun
          AWS_DEFAULT_REGION: ap-northeast-2
        run: |
          set -euo pipefail
          FN=graphql-api-prod-graphql
          URL=$(aws lambda get-function --function-name "$FN" --query 'Code.Location' --output text)
          curl -sL "$URL" -o /tmp/fn.zip
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('/tmp/fn.zip')
          names=z.namelist()
          print('total_files', len(names))
          print('top', sorted(set(n.split('/')[0] for n in names))[:50])
          hits=[n for n in names if 'reflect' in n.lower()]
          print('reflect_hits', hits[:50])
          print('has_node_modules_reflect', any(n.startswith('node_modules/reflect-metadata/') for n in names))
          # show start of handler bundle
          for cand in ['src/functions/graphql.js','graphql.js']:
            if cand in names:
              data=z.read(cand)[:500]
              print('bundle_head', cand, data[:500])
              break
          PY

          echo "=== first reflect-metadata error ever (oldest in retention) ==="
          START=$(( ($(date +%s) - 7*86400) * 1000 ))
          aws logs filter-log-events --log-group-name /aws/lambda/$FN --start-time "$START" --filter-pattern 'reflect-metadata' --max-items 5 > /tmp/first.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/first.json'))
          evs=d.get('events',[])
          print('count', len(evs))
          for e in evs[:5]:
            print(e.get('timestamp'), (e.get('message') or '')[:300])
          PY
