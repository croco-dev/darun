name: PullRequest CI

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]

permissions:
  contents: read

jobs:
  build:
    # MongoDB 8은 Linux 6.19에서 기동하지 않아 호환 실행기를 고정합니다.
    runs-on: ubuntu-22.04
    services:
      content-sync-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sync
          POSTGRES_PASSWORD: sync
          POSTGRES_DB: darun_content_sync
        ports: ["55437:5432"]
        options: >-
          --health-cmd "pg_isready -U sync -d darun_content_sync"
          --health-interval 2s --health-timeout 3s --health-retries 30
      content-sync-mongo:
        image: mongo:8
        ports: ["27037:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 2s --health-timeout 3s --health-retries 30

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=critical
      - name: Verify offline LLM evaluation contracts
        run: pnpm run test:eval-llm-content
      - name: Verify deployment revision and serialization contracts
        run: node --test scripts/deployment-guard.test.mjs
      - name: Verify Turbo environment forwarding and cache keys
        run: node --test scripts/turbo-environment.test.mjs
      - name: Verify recursive lint coverage
        run: node --test scripts/lint-coverage.test.mjs
      - name: Verify staged commit lint preserves partial changes
        run: node --test scripts/lint-staged.test.mjs
      - name: Verify sibling transport changes invalidate cancellation test cache
        run: node --test scripts/transport-test-cache.test.mjs
      - name: Verify deployment smoke checks with isolated HTTP fixtures
        run: node --test scripts/verify-deployment.test.mjs
      - run: pnpm run lint
      - name: Type Check
        run: pnpm run typecheck
      - name: Type Check (tsrs)
        # 4 vCPU 실행기 측정 결과: docs/tsrs-ci-performance.md
        run: pnpm run typecheck:tsrs --concurrency=4 -- --checkers 1
      - name: Check migration completeness
        run: pnpm --filter graphql-api run check:migrations
      - name: Build Lambda bundles
        run: pnpm --filter graphql-api run build:lambda
        env:
          INFRA_ENV: prod
      - name: Verify Lambda initialization and GraphQL schema
        run: pnpm --filter graphql-api run verify:lambda
      - name: Verify durable publication sync in PostgreSQL and MongoDB
        run: pnpm --filter graphql-api exec vitest run __tests__/contentSync.mongodb.test.ts
        env:
          CONTENT_SYNC_TEST_DATABASE_URL: postgresql://sync:sync@127.0.0.1:55437/darun_content_sync
          CONTENT_SYNC_TEST_MONGODB_URI: mongodb://127.0.0.1:27037
      - name: Create isolated PostgreSQL integrity databases
        run: |
          docker exec "${{ job.services.content-sync-postgres.id }}" psql -U sync -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE darun_job_config_attempts' \
            -c 'CREATE DATABASE darun_translation_integrity' \
            -c 'CREATE DATABASE darun_atomic_integrity' \
            -c 'CREATE DATABASE darun_migration_baseline' \
            -c 'CREATE DATABASE darun_alternative_integrity' \
            -c 'CREATE DATABASE darun_description_integrity' \
            -c 'CREATE DATABASE darun_lease_integrity'
      - name: Verify PostgreSQL integrity without skipped tests
        env:
          JOB_CONFIG_ATTEMPTS_TEST_DATABASE_URL: postgresql://sync:sync@127.0.0.1:55437/darun_job_config_attempts
          TRANSLATION_TEST_DATABASE_URL: postgresql://sync:sync@127.0.0.1:55437/darun_translation_integrity
          MIGRATION_BASELINE_TEST_DATABASE_URL: postgresql://sync:sync@127.0.0.1:55437/darun_migration_baseline
          ALTERNATIVE_TEST_DATABASE_URL: postgresql://sync:sync@127.0.0.1:55437/darun_alternative_integrity
          DESCRIPTION_EVIDENCE_TEST_DATABASE_URL: postgresql://sync:sync@127.0.0.1:55437/darun_description_integrity
          W4_DATABASE_URL: postgresql://sync:sync@127.0.0.1:55437/darun_lease_integrity
          W4_PG: "1"
          ATOMIC_TEST_DATABASE_URL: postgresql://sync:sync@127.0.0.1:55437/darun_atomic_integrity
        run: |
          REQUIRED_POSTGRES_GROUP=baseline pnpm --filter graphql-api exec vitest run __tests__/migrationBaseline.pg.test.ts --reporter=default --reporter="$GITHUB_WORKSPACE/apps/graphql-api/scripts/required-postgres-reporter.ts"
          REQUIRED_POSTGRES_GROUP=graphql pnpm --filter graphql-api exec vitest run __tests__/jobConfigAttempts.pg.test.ts __tests__/translationIntegrity.pg.test.ts __tests__/alternativeReplacement.pg.test.ts --reporter=default --reporter="$GITHUB_WORKSPACE/apps/graphql-api/scripts/required-postgres-reporter.ts"
          REQUIRED_POSTGRES_GROUP=products pnpm --filter @darun/products-datasource exec vitest run src/__tests__/W3AtomicApplyMaterialize.pg.test.ts src/__tests__/descriptionEvidence.postgresql.test.ts src/__tests__/W4JobLeaseRecovery.pg.test.ts --reporter=default --reporter="$GITHUB_WORKSPACE/apps/graphql-api/scripts/required-postgres-reporter.ts"
      - run: pnpm run test:coverage
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.node-version }}
          path: "**/coverage/**"
          retention-days: 7
      - name: Build
        run: pnpm run build
        env:
          # CI-only build values; this workflow never deploys its tier bundle.
          # NEXT_PUBLIC_* values are baked in and cannot be replaced by Worker vars.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://supabase.invalid' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_build_only' }}
          NEXT_PUBLIC_SITE_URL: https://tier.darun.io

  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CI: "true"
      ISOLATED_SMOKE: "1"
      INFRA_ENV: local
      RUNNING_ENV: local
      DATABASE_URL: postgresql://darun:darun@127.0.0.1:55438/darun_e2e
      MONGODB_URI: mongodb://127.0.0.1:27038/darun?directConnection=true
      FIREBASE_PROJECT_ID: darun-local
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      VOTE_IP_SALT: smoke-only-vote-salt
      CURSOR_SIGNATURE_SECRET: smoke-only-cursor-signature-secret-32-bytes
      NEXT_PUBLIC_INFRA_ENV: local
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: darun-local
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: localhost
      NEXT_PUBLIC_FIREBASE_API_KEY: local-api-key
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
      GRAPHQL_INTERNAL_URL: http://127.0.0.1:4000/graphql
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter service-web exec playwright install --with-deps chromium
      - name: Prepare disposable infrastructure and fixtures
        run: |
          mkdir -p smoke-artifacts
          # The app's fixed Sentry DSNs must not receive CI fixture telemetry.
          echo '127.0.0.1 o1088571.ingest.us.sentry.io' | sudo tee -a /etc/hosts
          docker compose -p darun-smoke -f docker-compose.smoke.yml up -d --wait --wait-timeout 180
          pnpm --filter graphql-api migrate
          pnpm --filter graphql-api seed:e2e
          pnpm --filter graphql-api exec tsx scripts/prepare-smoke-search.ts
      - name: Playwright Smoke Tests
        run: pnpm --filter service-web exec playwright test --grep '@smoke'
      - name: Collect disposable service logs
        if: always()
        run: |
          mkdir -p smoke-artifacts
          docker compose -p darun-smoke -f docker-compose.smoke.yml logs --no-color > smoke-artifacts/services.log 2>&1
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/service-web/playwright-report/
            apps/service-web/test-results/
            smoke-artifacts/
          retention-days: 7
      - name: Remove disposable infrastructure
        if: always()
        run: docker compose -p darun-smoke -f docker-compose.smoke.yml down -v
