name: PullRequest CI

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]

permissions:
  contents: read

jobs:
  build:
    # MongoDB 8은 Linux 6.19에서 기동하지 않아 호환 실행기를 고정합니다.
    runs-on: ubuntu-22.04
    services:
      content-sync-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sync
          POSTGRES_PASSWORD: sync
          POSTGRES_DB: darun_content_sync
        ports: ["55437:5432"]
        options: >-
          --health-cmd "pg_isready -U sync -d darun_content_sync"
          --health-interval 2s --health-timeout 3s --health-retries 30
      content-sync-mongo:
        image: mongo:8
        ports: ["27037:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 2s --health-timeout 3s --health-retries 30

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Audit dependencies
        run: pnpm audit --audit-level=critical
      - run: pnpm run lint
      - name: Type Check
        run: pnpm run typecheck
      - name: Check migration completeness
        run: pnpm --filter graphql-api run check:migrations
      - name: Build Lambda bundles
        run: pnpm --filter graphql-api run build:lambda
        env:
          INFRA_ENV: prod
      - name: Verify Lambda initialization and GraphQL schema
        run: pnpm --filter graphql-api run verify:lambda
      - name: Verify durable publication sync in PostgreSQL and MongoDB
        run: pnpm --filter graphql-api exec vitest run __tests__/contentSync.mongodb.test.ts
        env:
          CONTENT_SYNC_TEST_DATABASE_URL: postgresql://sync:sync@127.0.0.1:55437/darun_content_sync
          CONTENT_SYNC_TEST_MONGODB_URI: mongodb://127.0.0.1:27037
      - run: pnpm run test:coverage
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.node-version }}
          path: |
            **/coverage/lcov.info
            **/coverage/index.html
          retention-days: 7
      - name: Build
        run: pnpm run build
        env:
          # CI-only build values; this workflow never deploys its tier bundle.
          # NEXT_PUBLIC_* values are baked in and cannot be replaced by Worker vars.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://supabase.invalid' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_build_only' }}
          NEXT_PUBLIC_SITE_URL: https://tier.darun.io

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Playwright Smoke Tests
        # Non-blocking until CI has DB/Firebase/seed infrastructure for the webServer.
        # Re-enable blocking after: DB service + seed-e2e.ts + required env vars are wired.
        run: pnpm --filter service-web exec playwright test --grep "@smoke"
        continue-on-error: true
