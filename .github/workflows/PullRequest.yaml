name: PullRequest CI

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Audit dependencies
        run: pnpm audit --audit-level=critical
      - run: pnpm run lint
      - name: Type Check
        run: pnpm run typecheck
      - run: pnpm run test:coverage
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.node-version }}
          path: |
            **/coverage/lcov.info
            **/coverage/index.html
          retention-days: 7
      - name: Build
        run: pnpm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Playwright Smoke Tests
        # Non-blocking until CI has DB/Firebase/seed infrastructure for the webServer.
        # Re-enable blocking after: DB service + seed-e2e.ts + required env vars are wired.
        run: pnpm --filter service-web exec playwright test --grep "@smoke"
        continue-on-error: true
