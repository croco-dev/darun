name: Production Deploy

on:
  push:
    branches:
      - trunk
  workflow_dispatch:
    inputs:
      allow_rollback:
        description: "Explicitly deploy the selected revision even when it is not current trunk"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [TRIGGER_DEPLOY]

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Typecheck (tsrs)
        run: pnpm run typecheck:tsrs --concurrency=4 -- --checkers 1
      - name: Test
        run: pnpm run test
      - name: Check migration completeness
        run: pnpm --filter graphql-api run check:migrations

  deploy:
    name: deploy
    needs: quality
    # One lock covers revision selection, migration, SST and any later smoke checks.
    concurrency:
      group: prod-graphql
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: prod-graphql
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Select deployment revision
        id: revision
        run: node scripts/deployment-guard.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
      - uses: pnpm/action-setup@v4
        if: steps.revision.outputs.deploy == 'true'
      - name: Use Node.js 22.x
        if: steps.revision.outputs.deploy == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: "pnpm"
      - name: Install dependencies
        if: steps.revision.outputs.deploy == 'true'
        run: pnpm install
      - name: Configure AWS Profile iam
        if: steps.revision.outputs.deploy == 'true'
        uses: croco-dev/aws-profile-action@v1.3
        with:
          profile: darun
          region: ap-northeast-2
          access-key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Install SST providers
        if: steps.revision.outputs.deploy == 'true'
        run: pnpm --filter graphql-api exec sst install
      - name: Build Lambda bundles
        if: steps.revision.outputs.deploy == 'true'
        run: pnpm --filter graphql-api run build:lambda
        env:
          INFRA_ENV: prod
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Verify Lambda initialization and GraphQL schema
        if: steps.revision.outputs.deploy == 'true'
        run: pnpm --filter graphql-api run verify:lambda
      - name: Run Database Migrations
        if: steps.revision.outputs.deploy == 'true'
        run: pnpm --filter graphql-api run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy
        if: steps.revision.outputs.deploy == 'true'
        run: pnpm --filter graphql-api exec sst deploy --stage prod
        env:
          AWS_PROFILE: darun
          INFRA_ENV: prod
          RUNNING_ENV: ${{ secrets.RUNNING_ENV }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          CURSOR_SIGNATURE_SECRET: ${{ secrets.CURSOR_SIGNATURE_SECRET }}
          VISUAL_FLOW_WRITES_ENABLED: "false"
          VOTE_IP_SALT: ${{ secrets.VOTE_IP_SALT }}
      - name: Verify deployed GraphQL
        run: node scripts/verify-deployment.mjs
        timeout-minutes: 2
        env:
          GITHUB_SHA: ${{ github.sha }}
