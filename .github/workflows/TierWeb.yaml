name: TierWeb

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Cloudflare Workers production after build (keeps existing vars)"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: https://tier.darun.io
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Check build environment
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "Missing NEXT_PUBLIC_SUPABASE_URL repository variable"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "Missing NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY repository variable"; exit 1; }
      - name: Lint
        run: pnpm --filter tier-web run lint
      - name: Typecheck
        run: pnpm --filter tier-web run typecheck
      - name: Test
        run: pnpm --filter tier-web run test
      - name: Cloudflare build
        run: pnpm --filter tier-web run cloudflare:build

  deploy:
    name: deploy
    needs: build
    if: ${{ inputs.deploy == true }}
    runs-on: ubuntu-latest
    environment:
      name: tier-web-prod
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Check deployment environment
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.TIER_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TIER_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "Missing NEXT_PUBLIC_SUPABASE_URL variable"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "Missing NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY variable"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing TIER_CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing TIER_CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
      - name: Deploy
        # --keep-vars preserves existing Worker variables. Server-only Supabase
        # secrets remain on the Worker; public client values must exist at build.
        run: pnpm --filter tier-web run deploy
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://tier.darun.io
          CLOUDFLARE_API_TOKEN: ${{ secrets.TIER_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TIER_CLOUDFLARE_ACCOUNT_ID }}
