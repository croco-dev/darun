packages:
  - "apps/*"
  - "libs/*/*"
  - "libs/shared/*"
  - "libs/shared/*/*"
  - "!**/node_modules/**"
  - "!**/.next/**"
  - "!**/dist/**"
  - "!**/build/**"

shamefullyHoist: true
autoInstallPeers: true
saveExact: true
minimumReleaseAge: 0
strictDepBuilds: false

overrides:
  graphql: "16.12.0"
  form-data: ">=2.5.4"
  fast-xml-parser: ">=4.5.5"
  protobufjs: ">=7.5.5"
  shell-quote: ">=1.8.4"
  velocityjs: ">=2.1.7"
  websocket-driver: ">=0.7.5"

allowBuilds:
  '@apollo/protobufjs': true
  '@firebase/util': true
  '@parcel/watcher': true
  '@sentry-internal/node-cpu-profiler': true
  '@sentry/cli': true
  '@swc/core': true
  core-js: true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  type-graphql: true
  unrs-resolver: true
