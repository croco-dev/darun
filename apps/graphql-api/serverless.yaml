org: croco
app: darun
service: graphql-api
frameworkVersion: "4"

useDotenv: true

plugins:
  - serverless-esbuild
  - serverless-offline
  - serverless-prune-plugin

build:
  esbuild: false

custom:
  esbuild:
    bundle: true
    exclude: ["class-validator"]
    external:
      - reflect-metadata
    packager: pnpm
    minify: true
    keepNames: true
    sourcemap: true
    sourcesContent: false
    treeShaking: true
    ignoreAnnotations: true
    banner:
      js: "require('reflect-metadata');"
    plugins: esbuild.plugins.js
    watch:
      patterns:
        - "src/**/*.ts"
        - "../../libs/**/*.ts"
  serverless-offline:
    httpPort: 4000
    reloadHandler: true
  prune:
    automatic: true
    number: 1

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-2
  stackName: ${self:provider.stage}-${self:service}
  stage: ${opt:stage, 'local'}
  profile: darun
  deploymentBucket: darun-deploy-bucket
  architecture: arm64
  logRetentionInDays: 7
  timeout: 30

functions:
  graphql:
    handler: src/functions/graphql.handler
    events:
      - httpApi:
          path: /graphql
          method: post
      - httpApi:
          path: /graphql
          method: get
    environment:
      INFRA_ENV: ${env:INFRA_ENV}
      RUNNING_ENV: ${env:RUNNING_ENV}
      DATABASE_URL: ${env:DATABASE_URL}
      FIREBASE_PROJECT_ID: ${env:FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${env:FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${env:FIREBASE_CLIENT_EMAIL}
      MONGODB_URI: ${env:MONGODB_URI}
      CLOUDINARY_CLOUD_NAME: ${env:CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${env:CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${env:CLOUDINARY_API_SECRET}
      OPEN_ROUTER_API_KEY: ${env:OPEN_ROUTER_API_KEY}
      CURSOR_SIGNATURE_SECRET: ${env:CURSOR_SIGNATURE_SECRET}
